<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 상단 헤더 바 (구글 캘린더 상단 영역) ===== -->
  <header class="app-header">
    <!-- 헤더 왼쪽: 로고 / 월 이동 / 현재 기간 -->
    <div class="header-left">
      <div class="brand">
        <span class="brand-logo">📅</span>
        <span class="brand-title">Todo</span>
      </div>

      <!-- 이전 달 / 다음 달 이동 -->
      <div class="nav-arrows">
        <button class="icon-button" id="prevButton" aria-label="이전 달">‹</button>
        <button class="icon-button" id="nextButton" aria-label="다음 달">›</button>
      </div>

      <!-- 현재 보고 있는 연/월 (JS가 채워줌) -->
      <h1 class="period-label" id="periodLabel">2026년 6월</h1>
    </div>

    <!-- 헤더 오른쪽: 보기 전환 -->
    <div class="header-right">
      <!-- 보기 전환 (월/주/일) — data-view 값으로 보기 모드 구분 -->
      <div class="view-switch" id="viewSwitch">
        <button class="view-button is-active" data-view="month">월</button>
        <button class="view-button" data-view="week">주</button>
        <button class="view-button" data-view="day">일</button>
      </div>
    </div>
  </header>

  <!-- ===== 본문: 좌측 사이드바 + 우측 캘린더 ===== -->
  <div class="app-body">
    <!-- 좌측 사이드바 -->
    <aside class="sidebar">
      <!-- 할 일 만들기 버튼 (구글 캘린더의 '만들기' 느낌) -->
      <button class="create-button" id="createButton">
        <span class="create-plus">＋</span>
        <span>만들기</span>
      </button>

      <!-- 사이드바 미니 달력 -->
      <section class="mini-calendar">
        <div class="mini-header">
          <span class="mini-period" id="miniPeriodLabel">2026년 6월</span>
          <div class="mini-nav">
            <button class="icon-button mini-arrow" id="miniPrevButton" aria-label="이전 달">‹</button>
            <button class="icon-button mini-arrow" id="miniNextButton" aria-label="다음 달">›</button>
          </div>
        </div>
        <!-- 요일 헤더 -->
        <div class="mini-weekdays" id="miniWeekdays"></div>
        <!-- 날짜 격자 (JS가 채워줌) -->
        <div class="mini-days" id="miniDays"></div>
      </section>

      <!-- 등록된 일정 목록 (JS가 채워줌) -->
      <section class="todo-list-section">
        <h2 class="label-title">일정 목록</h2>

        <!-- 상태 필터 — 기본은 '전체'(완료 제외), '완료'를 직접 눌러야 완료 항목이 보임 -->
        <div class="todo-filters" id="todoFilters">
          <button class="filter-button is-active" data-filter="all">전체</button>
          <button class="filter-button" data-filter="upcoming">예정</button>
          <button class="filter-button" data-filter="inProgress">진행중</button>
          <button class="filter-button" data-filter="completed">완료</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>
      </section>
    </aside>

    <!-- 우측 메인 캘린더 — 보기 모드(월/주/일)에 따라 JS가 내용을 그려줌 -->
    <main class="calendar" id="calendarView"></main>
  </div>

  <!-- ===== 일정 등록/수정 모달 ===== -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 class="modal-title" id="modalTitle">일정 추가</h2>

      <!-- 제목 -->
      <label class="field">
        <span class="field-label">제목</span>
        <input type="text" id="todoTitle" class="field-input" placeholder="할 일을 입력하세요" />
      </label>

      <!-- 날짜 -->
      <label class="field">
        <span class="field-label">날짜</span>
        <input type="date" id="todoDate" class="field-input" />
      </label>

      <!-- 시작 / 종료 시간 -->
      <div class="field-row">
        <label class="field">
          <span class="field-label">시작</span>
          <input type="time" id="todoStart" class="field-input" />
        </label>
        <label class="field">
          <span class="field-label">종료</span>
          <input type="time" id="todoEnd" class="field-input" />
        </label>
      </div>

      <!-- 입력값이 비어 있을 때 안내 메시지 -->
      <p class="modal-error" id="modalError" hidden>제목을 입력해 주세요.</p>

      <!-- 동작 버튼 -->
      <div class="modal-actions">
        <button class="modal-button is-cancel" id="modalCancel">취소</button>
        <button class="modal-button is-save" id="modalSave">저장</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
